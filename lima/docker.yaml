minimumLimaVersion: 1.1.0

base:
- template://_images/alpine
- template://_default/mounts

arch: aarch64

vmType: "vz"

rosetta:
  enabled: true
  binfmt: true

mounts:
- location: "~"
  writable: true
- location: "/tmp/lima"
  writable: true
mountType: "virtiofs"

# The built-in containerd installer does not support Alpine currently.
# Hint: use the "rd" ISO instead of the "std" ISO to enable containerd: https://github.com/lima-vm/alpine-lima/releases/
containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    apk update
    apk add docker docker-compose
    #usermod -aG docker $USER
    usermod -aG docker a
    chmod 666 /var/run/docker.sock
    mkdir /etc/docker
    # containerd-snapshotter を無効化し classic イメージストアを使う。
    # 有効だと build/push が OCI(attestation 付き index)になり、AWS Lambda の
    # コンテナイメージが "image manifest ... media type ... not supported" で弾かれるため。
    echo "{\"hosts\": [\"tcp://127.0.0.1:2375\", \"unix:///var/run/docker.sock\"], \"features\": {\"containerd-snapshotter\": false}}" > /etc/docker/daemon.json
    service docker start

cpus: 2
memory: "8GiB"
disk: "150GiB"

portForwards:
- guestSocket: "/run/user/{{.UID}}/docker.sock"
  hostSocket: "{{.Dir}}/sock/docker.sock"

networks:
# The "vzNAT" IP address is accessible from the host, but not from other guests.
- vzNAT: true
