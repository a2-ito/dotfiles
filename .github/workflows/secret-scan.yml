name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎週月曜 06:00 JST (日曜 21:00 UTC) に全履歴をスキャンする
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # push / pull_request では差分、schedule では全履歴をスキャンするため全部取得する
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true
